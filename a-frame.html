
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interacciones básicas - A-Frame</title>

    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
</head>

<body>
    <a-scene>

        <!-- Textura del piso -->
        <a-assets>
            <img id="floorTexture"
                 src="https://threejs.org/examples/textures/brick_diffuse.jpg">
        </a-assets>

        <!-- Textos de bienvenida -->
        <a-text
            value="¡Bienvenido a tu nueva recamara!"
            position="-2 4 -5"
            color="#000000"
            scale="1.5 1.5 1.5">
        </a-text>

        <a-text
            value="Pasa el cursor sobre las esferas para cambiar el fondo"
            position="-2.5 3.3 -5"
            color="#000000"
            scale="1 1 1">
        </a-text>

        <!-- Esfera roja -->
        <a-sphere
            position="-3 1 -5"
            radius="0.7"
            color="#FF5733"
            event-set__enter="_event: mouseenter; _target: #bg; color: #FF5733">
        </a-sphere>

        <!-- Esfera azul -->
        <a-sphere
            position="-1 1 -5"
            radius="0.7"
            color="#3498DB"
            event-set__enter="_event: mouseenter; _target: #bg; color: #3498DB">
        </a-sphere>

        <!-- Esfera verde -->
        <a-sphere
            position="1 1 -5"
            radius="0.7"
            color="#2ECC71"
            event-set__enter="_event: mouseenter; _target: #bg; color: #2ECC71">
        </a-sphere>

        <!-- Esfera morada -->
        <a-sphere
            position="3 1 -5"
            radius="0.7"
            color="#9B59B6"
            event-set__enter="_event: mouseenter; _target: #bg; color: #9B59B6">
        </a-sphere>

        <!-- Controles VR -->
        <a-entity laser-controls="hand: left"></a-entity>
        <a-entity laser-controls="hand: right"></a-entity>

        <!-- Fondo que cambia de color -->
        <a-sky id="bg" color="#E8DCCB"></a-sky>

        <!-- Piso con textura de ladrillo -->
        <a-plane
            src="#floorTexture"
            rotation="-90 0 0"
            width="50"
            height="50"
            repeat="10 10">
        </a-plane>

        <!-- Cámara y cursor -->
        <a-camera position="0 1.6 0">
            <a-cursor></a-cursor>
        </a-camera>

    </a-scene>
</body>
</html>
